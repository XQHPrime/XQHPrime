name: update coding profile cards

on:
  push:
    paths:
      - "assets/coding-profiles/**"
      - "scripts/generate_coding_profile_cards.mjs"
      - ".github/workflows/nowcoder-card.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: coding-profile-cards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Coding Profiles cards
        run: node scripts/generate_coding_profile_cards.mjs --mode live --output-dir "${{ runner.temp }}/coding-profiles"

      - name: Publish cards to the profiles-output branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin profiles-output:refs/remotes/origin/profiles-output; then
            git switch --force-create profiles-output origin/profiles-output
          else
            git switch --orphan profiles-output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "${{ runner.temp }}/coding-profiles/codeforces-card.svg" codeforces-card.svg
          cp "${{ runner.temp }}/coding-profiles/nowcoder-card.svg" nowcoder-card.svg
          git add codeforces-card.svg nowcoder-card.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update coding profile cards"
          git push origin HEAD:profiles-output
