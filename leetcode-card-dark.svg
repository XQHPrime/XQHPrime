<svg width="600" height="270" viewBox="0 0 600 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <!-- Edit this template for layout/style only. Data is injected by scripts/generate_coding_profile_cards.mjs. -->
  <title id="title">LeetCode Stats Card</title>
  <desc id="desc">LeetCode China profile card for 多情最是王糊涂</desc>
  <style>
    :root {
      --bg-start: #111827;
      --bg-mid: #0f172a;
      --bg-end: #0b1120;
      --surface: #111827;
      --surface-muted: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --hint: #cbd5e1;
      --border: #334155;
      --platform-a: #f59e0b;
      --platform-b: #f97316;
      --platform-c: #22c55e;
      --platform-value: #fde68a;
      --badge-text: #111827;
    }

    .bg-start { stop-color: var(--bg-start); }
    .bg-mid { stop-color: var(--bg-mid); }
    .bg-end { stop-color: var(--bg-end); }
    .accent-a { stop-color: var(--platform-a); }
    .accent-b { stop-color: var(--platform-b); }
    .accent-c { stop-color: var(--platform-c); }
    .card-bg { fill: url(#bg); }
    .surface { fill: var(--surface); stroke: var(--border); }
    .surface-muted { fill: var(--surface-muted); stroke: var(--border); }
    .border { stroke: var(--border); }
    .accent-fill { fill: url(#accent); }
    .badge-fill { fill: url(#badgeFill); }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .hint { fill: var(--hint); }
    .platform-a-fill { fill: var(--platform-a); }
    .platform-b-fill { fill: var(--platform-b); }
    .platform-c-fill { fill: var(--platform-c); }
    .platform-value { fill: var(--platform-value); }
    .badge-text { fill: var(--badge-text); }
  </style>
  <defs>
